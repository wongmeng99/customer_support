[project]
name = "customer-support"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-sdk>=0.4.11",
    "langsmith>=0.14.16",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
